<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMART POS - Fluxo de Caixa & Bolhas Flutuantes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Carregamento do Chart.js original -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b071e;
        }
        .bubble-enter {
            animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex items-center justify-center p-4 relative">

    <!-- Input global oculto para seleção múltipla -->
    <input type="file" id="globalBatchInput" multiple accept="image/*,application/pdf" class="hidden" onchange="window.handleBatchFiles(event)">

    <!-- Container Principal do Dashboard -->
    <div class="w-full max-w-[1380px] bg-[#120c2d] border border-indigo-900/40 rounded-2xl shadow-2xl flex">
        
        <!-- Sidebar -->
        <aside class="w-64 bg-[#140d34] border-r border-indigo-900/30 flex flex-col justify-between p-6 shrink-0 rounded-l-2xl">
            <div>
                <!-- Logo -->
                <div class="flex items-center space-x-3 mb-8">
                    <div class="w-8 h-8 rounded-lg border-2 border-cyan-400 flex items-center justify-center text-cyan-400 font-bold rotate-45">
                        <span class="-rotate-45">◇</span>
                    </div>
                    <span class="text-lg font-bold tracking-wider text-white">SMART POS</span>
                </div>

                <!-- Campo de Pesquisa -->
                <div class="mb-6 relative">
                    <svg class="w-4 h-4 absolute left-3 top-2.5 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="Buscar lançamentos..." class="w-full bg-[#1e1545] border border-indigo-900/50 rounded-lg pl-9 pr-4 py-2 text-xs text-slate-300 focus:outline-none focus:border-indigo-500 placeholder-slate-500">
                </div>

                <!-- Menu de Navegação -->
                <nav class="space-y-6 text-xs">
                    <div>
                        <span class="text-slate-500 font-semibold uppercase tracking-wider text-[10px] block mb-3">Menu</span>
                        <a href="#" class="flex items-center space-x-3 px-4 py-2.5 bg-indigo-600 text-white rounded-xl font-medium shadow-lg shadow-indigo-600/30">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                            <span>Dashboard</span>
                        </a>
                    </div>

                    <div>
                        <span class="text-slate-500 font-semibold uppercase tracking-wider text-[10px] block mb-3">Automação n8n</span>
                        <div class="space-y-2 text-slate-400">
                            <a href="#" class="flex items-center space-x-3 px-4 py-1.5 hover:text-white transition">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                                <span>Recibos & DANFE</span>
                            </a>
                            <a href="#" class="flex items-center space-x-3 px-4 py-1.5 hover:text-white transition">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"></path><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"></path></svg>
                                <span>Fluxo de Caixa</span>
                            </a>
                        </div>
                    </div>
                </nav>
            </div>

            <!-- Card n8n Engine -->
            <div class="mt-8 bg-gradient-to-br from-indigo-600 to-purple-700 rounded-2xl p-4 text-center relative overflow-hidden shadow-lg">
                <div class="flex justify-between items-start mb-2">
                    <span class="font-bold text-sm text-white">n8n Engine</span>
                    <span class="w-2.5 h-2.5 bg-emerald-400 rounded-full animate-pulse"></span>
                </div>
                <p class="text-[10px] text-indigo-100 text-left mb-3">OCR + Gemini AI Conectado</p>
                <button onclick="document.getElementById('globalBatchInput').click()" class="w-full bg-white/20 hover:bg-white/30 text-white py-1.5 rounded-lg text-xs font-semibold transition cursor-pointer">+ Nova Leitura</button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 p-6 space-y-6">

            <!-- Top Header -->
            <header class="flex justify-between items-center mb-2">
                <h1 class="text-xl font-semibold text-white">Dashboard Financeiro</h1>
                
                <div class="flex items-center space-x-4">
                    <button onclick="document.getElementById('globalBatchInput').click()" class="flex items-center space-x-2 bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-xs font-semibold transition shadow-lg shadow-indigo-600/30 cursor-pointer active:scale-95">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        <span>Nova Movimentação</span>
                    </button>

                    <div class="flex items-center space-x-3 bg-[#140d34] px-3 py-1.5 rounded-full border border-indigo-900/40">
                        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80" alt="Avatar" class="w-8 h-8 rounded-full object-cover border border-indigo-400">
                        <div class="text-xs">
                            <p class="font-semibold text-white flex items-center gap-1">
                                Dev LabzRatz
                                <svg class="w-3 h-3 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
                            </p>
                            <p class="text-[10px] text-slate-400">ID 1252012</p>
                        </div>
                    </div>
                </div>
            </header>

            <!-- 4 Top Cards Metric -->
            <div class="grid grid-cols-4 gap-4">
                <div class="bg-[#5c46e5] p-4 rounded-2xl flex justify-between items-center shadow-lg">
                    <div>
                        <div class="flex items-center space-x-1.5 mb-2">
                            <span class="text-xs text-white">Δ</span>
                            <span class="text-xs text-indigo-100 font-medium">Entradas (Mês)</span>
                        </div>
                        <p class="text-2xl font-bold text-white">R\$ 48.250,00</p>
                    </div>
                    <div class="relative w-12 h-12 flex items-center justify-center">
                        <svg class="w-full h-full transform -rotate-90">
                            <circle cx="24" cy="24" r="18" stroke="currentColor" stroke-width="3" class="text-indigo-400/30" fill="transparent"/>
                            <circle cx="24" cy="24" r="18" stroke="currentColor" stroke-width="3" class="text-white" stroke-dasharray="113" stroke-dashoffset="17" fill="transparent"/>
                        </svg>
                        <span class="absolute text-[10px] font-semibold text-white">85%</span>
                    </div>
                </div>

                <div class="bg-[#17c6d4] p-4 rounded-2xl flex justify-between items-center shadow-lg">
                    <div>
                        <div class="flex items-center space-x-1.5 mb-2">
